<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07162B" />
      <stop offset="100%" stop-color="#102541" />
    </linearGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#168BFF" />
      <stop offset="100%" stop-color="#28D7F2" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  
  <!-- Outer glowing ring -->
  <rect x="56" y="56" width="400" height="400" rx="60" fill="none" stroke="url(#neon)" stroke-width="8" opacity="0.8"/>
  
  <!-- Elevator Cabin Framework -->
  <rect x="136" y="116" width="240" height="280" rx="24" fill="#0A1E38" stroke="#168BFF" stroke-width="10"/>
  
  <!-- Doors Left & Right -->
  <rect x="156" y="146" width="94" height="220" rx="8" fill="#102541" stroke="#28D7F2" stroke-width="4"/>
  <rect x="262" y="146" width="94" height="220" rx="8" fill="#102541" stroke="#28D7F2" stroke-width="4"/>
  <line x1="256" y1="146" x2="256" y2="366" stroke="#28D7F2" stroke-width="3" stroke-dasharray="8 6"/>

  <!-- Up & Down Arrows inside -->
  <path d="M203 210 L185 245 L221 245 Z" fill="#28D7F2"/>
  <path d="M309 300 L291 265 L327 265 Z" fill="#168BFF"/>

  <!-- Digital Floor Indicator 10 -->
  <rect x="216" y="70" width="80" height="34" rx="6" fill="#07162B" stroke="#28D7F2" stroke-width="2"/>
  <text x="256" y="94" font-family="monospace, sans-serif" font-size="22" font-weight="900" fill="#28D7F2" text-anchor="middle">10</text>

  <!-- Tagline text -->
  <text x="256" y="445" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="26" font-weight="800" fill="#FFFFFF" letter-spacing="4" text-anchor="middle">DANFEZ</text>
</svg>
